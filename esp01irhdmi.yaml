esphome:
  name: esp01irhdmi
  friendly_name: ESP01IRhdmi

esp8266:
  board: esp01_1m

substitutions:
  device_name: IR_hdmi     

# Enable logging https://www.forward.com.au/pfod/ESP8266/GPIOpins/ESP_01S.jpg
logger:

# Enable Home Assistant API
api:
  #encryption:
    #key: wAe7mVRh7wPm5p08qCohdp3XtFPMQc1b/+FMVft3+SI=

ota:
  - platform: esphome
    password: "3e05bcaeb3659d58a1fe53b9f7a52ecd"

web_server:
  js_include: "esphomecss/www.js"
  js_url: ""
  version: 2

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
 
  ap:
    ssid: "Esp01Irhdmi Fallback Hotspot"
    password: "kipkipkip"
 
remote_transmitter:   
  pin:
    number: GPIO0
    inverted: true  #de esp01 start niet als dit pulldown is , dus de led via D0 en de plus geschakeld
  carrier_duty_percent: 50%

button:
  - platform: template
    name: hdmi1
    id: hdmi1
    # Optional variables:  "hex":"0x1FE609F","protocol_name":"NEC",
    icon: "mdi:emoticon-outline"
    #Received NEC: address=0x7F80, command=0xFD02
    on_press:
      - logger.log: "Button hdmi1 pressed"  
      - remote_transmitter.transmit_nec:
          address: 0x7F80
          command: 0xFD02
 
  - platform: template
    name: hdmi2
    id: hdmi2
    # Optional variables: [18:10:52][I][remote.nec:070]: Received NEC: address=0x7F80, command=0xFB04
    icon: "mdi:emoticon-outline"
    on_press:
      - logger.log: "Button hdmi2 pressed"  
      - remote_transmitter.transmit_nec:
          address: 0x7F80
          command: 0xFB04
 
  - platform: template
    name: hdmi3
    id: hdmi3  #tvv
    # Optional variables: :11:31][I][remote.nec:070]: Received NEC: address=0x7F80, command=0xF906
    icon: "mdi:emoticon-outline"
    on_press:
      - logger.log: "Button hdmi3 pressed"  
      - remote_transmitter.transmit_nec:
          address: 0x7F80
          command: 0xF906

#switch:
  - platform: restart
    name: irhdmi_restart

# blauwe builtin Led https://mischianti.org/wp-content/uploads/2023/09/esp-01s-esp8266-pinout-mischianti-low-res.jpg
output:
  - platform: gpio
    pin: 2 #GPIO2 + hardwired met de ingebouwde led
    id: gpio_2
    inverted: yes
  
 # - platform: gpio
 #   pin: 0 #GPIO0 aan massa  =  flash/bootmode
 #   id: gpio_0
  #  inverted: yes

## blauwe builtin Led op gpio_2
light:
  - platform: binary
    output: gpio_2
    name: esp-builinledBLEU2
 
switch:
  - platform: homeassistant
    id: velbusryld_4_tvvvlaanderen_chromec_irhdmi
    entity_id: switch.velbusryld_4_tvvvlaanderen_chromec_irhdmi
    internal: true
    on_turn_on:
      then:
        - delay : 1s
        - button.press: hdmi3
        - delay : 1s
        - button.press: hdmi3
        - delay : 1s
        - button.press: hdmi3
        - delay : 1s
        - button.press: hdmi3


   