as5600:
  start_position: 306deg
  range: 360deg 
  id: my_as5600 

sensor:
 

#sensor:
  - platform: as5600
    name: Position
    id : as5600position
    raw_position:
        name: Raw Position
        id : rawpos
    gain:
        name: Gain
    magnitude:
        name: Magnitude
    status:
        name: Status

 

 
#sensor:
  - platform: as5600
    update_interval: 1s
    name: Angle
    id : hoek
    unit_of_measurement: '°'
    accuracy_decimals: 2
    icon: mdi:rotate-right
    filters:
      - delta: 1
      - lambda: 'return x * as5600::RAW_TO_DEGREES * id(my_as5600).get_range_scale();'


