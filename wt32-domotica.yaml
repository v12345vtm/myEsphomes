    update_interval: 60s
    lambda: |-
      static float last_value = 0;
      static unsigned long last_time = 0;
      float current_value = id(slimmegasmeter).state;  // m³ total
      unsigned long now = millis();
      if (isnan(current_value)) return NAN;
      // First run → just initialize
      if (last_time == 0) {
        last_time = now;
        last_value = current_value;
        return 0;
      }
      float delta_m3 = current_value - last_value;
      float delta_minutes = (now - last_time) / 60000.0;  // ms → minutes
      last_value = current_value;
      last_time = now;
      if (delta_m3 < 0) return 0;  // safety in case of reset
      float liters_per_min = delta_m3 * 1000.0 / delta_minutes;  // m³ → L
      return liters_per_min;

#sensor:
  - platform: template
    name: "Capaciteitstarief hoeveel % tegen verbrand deze maand (van2.5kw tot ...)"
    id: capaciteitstarief_pct_until_burned
    update_interval: 60s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      float current = id(active_energy_import_current_average_demand).state;
      float limit_raw = id(maandpiek_value);
      float limit = (limit_raw >= 2.5) ? limit_raw : 2.5;
      if (limit <= 0) return 0;
      float pct = (current / limit) * 100.0;
      return round(pct * 10) / 10.0;
