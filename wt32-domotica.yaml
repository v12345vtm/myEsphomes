      if (pct >= 100) return {">100% - Verbrand voor de rest van de maand"};
      if (pct >= 90)  return {">90% - Hoog, bijna aan limiet. Leg iets af!"};
      if (pct >= 80)  return {">80% - Redelijk hoog."};
