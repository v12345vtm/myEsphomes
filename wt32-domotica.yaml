binary_sensor:
  - platform: template
    name: "P1 Uart error"  #alsde esp 3minuten geen data verandering ziet = error
    id: voltage_unchanged_warning
    entity_category: diagnostic
    lambda: |-
      static float last_voltage = -1;
      static unsigned long last_change_time = 0;
      float current_voltage = id(voltage_l1).state;  // Make sure 'voltage_l1' sensor has id voltage_l1
      unsigned long now = millis();
      if (current_voltage != last_voltage) {
        last_voltage = current_voltage;
        last_change_time = now;
        return false;  // No warning, voltage changed
      }
      // Check if voltage unchanged for over 3 minutes (180000 ms)
      if ((now - last_change_time) > 180000) {
        return true;  // Warning, voltage unchanged for 3 minutes
      }
      return false;  // No warning yet

  - platform: template
    name: "Verwitteging van ingestelde drempel" #op capaciteits tarief 15min
    id: peak_above_limit
    entity_category: diagnostic
    icon : "mdi:facebook-messenger"
    lambda: |-
      float demand = id(active_energy_import_current_average_demand).state;
      float threshold = atof(id(VerwittigMeOpKwh).state.c_str());  // convert text input to float
      if (isnan(demand) || isnan(threshold)) {
        return false;  // safety fallback
      }
      if (demand > threshold) {
        return true;   // ON when above threshold
      } else {
        return false;  // OFF otherwise
      }

#binary_sensor:
  - platform: template
    name: "Send SMS Trigger"
    id: send_sms_trigger
    icon : "mdi:phone-clock"
    entity_category: diagnostic
    lambda: |-
      if (id(peak_above_limit).state && !id(niet_storen_tussen).state)
        return true;
      else
        return false;
 
#binary_sensor: 
  - platform: template
    name: "Niet Storen"
    id: niet_storen_tussen
    entity_category: diagnostic
    icon: "mdi:bell-sleep"
    lambda: |-
      // If main_switch is ON, do not activate "Do Not Disturb"
      if (id(main_switch).state) return false;
      // Get current time from SNTP
      auto now = id(my_time).now();
      int now_minutes = now.hour * 60 + now.minute;
      int start_minutes = id(time_nacht_start).hour * 60 + id(time_nacht_start).minute;
      int stop_minutes  = id(time_nacht_stopt).hour * 60 + id(time_nacht_stopt).minute;
      // Check if current time is within range
      if (start_minutes <= stop_minutes) {
        return now_minutes >= start_minutes && now_minutes < stop_minutes;
      } else {
        // Time range spans midnight
        return now_minutes >= start_minutes || now_minutes < stop_minutes;
      }
