#ESP32 Pin            |  PCM5102 Pin  |  Function    
# --------------------+---------------+--------------
# GPIO 15             |  LCK / LRCK   |  Word select 
# GPIO 12             |  BCK   / BCLK |  Bit clock   
# GPIO 33  (485_EN)   |  XSMT         |  Mute control i2s module
# GPIO 14             | Dout /DIN     | digital audio out
# 3.3V                |  VCC          |  Power   dac    
# GND                 |  GND          |  Ground    dac  
# GPIO 32  (CFG)      |  IR LEd       | pioneer a702r remote


#  https://github.com/v12345vtm/VintagePioneerIR/tree/main
#  https://www.hackerspace-ffm.de/wiki/images/WT32-ETH01_pinout_LL.png

esphome:
  name: wt32sonos
  friendly_name: WT32Sonos
  on_boot: 
    then:
      - delay: 3s

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
#  level: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: !secret apikey

ota:
  - platform: esphome
    password: !secret otapassword


ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN   # or CLK_OUT depending on your board specs
  phy_addr: 1
  power_pin: GPIO16
  id: eth

# Example configuration entry  sd(data of dout of din) 32     ws 15 (Clk of lrck )      sck 14 (Blck )       master niet
i2s_audio:
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO12

remote_transmitter:
  pin: GPIO32  # IMPORTANT: Change this to the GPIO pin your IR LED is connected to.  
  carrier_duty_percent: 50% # Standard for most IR protocols

  

media_player:
  - platform: i2s_audio
    name: WT32Sonos
    dac_type: external
    i2s_dout_pin: GPIO14
    mode: stereo
    id: i2s_player
    on_state:
      - if:
          condition:
            media_player.is_paused: i2s_player
          then:
            - switch.turn_on: mute_switch
          else:
            - switch.turn_off: mute_switch

      - if:
          condition:
            media_player.is_playing: i2s_player
          then:
            - switch.turn_off: mute_switch

    on_idle:
      - delay: 105s
      - if:
          condition:
            media_player.is_idle: i2s_player
          then:
            - switch.turn_off: mute_switch


# Define a mute/unmute switch
switch:
  - platform: gpio
    pin: GPIO33
    name: "Mute"
    id: mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:volume-off
    inverted: True


web_server:
  port: 80

 



text:
  - platform: template
    name: "Radio URL"
    id: radio_url
    optimistic: true
    mode: text
    initial_value: "http://icecast.vrtcdn.be/ra2wvl-mid.mp3"
    on_value:
      - logger.log:
          format: "New stream URL set to: %s"
          args: [x.c_str()]

button:
  - platform: template
    name: "Play Radio"
    id: play_radio_button
    icon: "mdi:radio"
    on_press:
      - logger.log: "Play button pressed"
      - media_player.volume_set:
          id: i2s_player
          volume: 0.6
      - delay: 0.1s
      - media_player.play_media:
          id: i2s_player
          media_url: !lambda 'return id(radio_url).state;'


#button: 
  - platform: template
    name: radio2
    id: radio2drukknop
    icon: "mdi:emoticon-outline"
    on_press:
