esp32:
  board: esp32dev
  framework:
    type:  arduino


substitutions:
  device_name: mac5060      

# Enable logging 
logger:


http_request:
  useragent: esphome/device
  timeout: 10s  
  verify_ssl: false  

# Enable Home Assistant API
api:  
  encryption:
    key: "1A79q+SCGygjqY1PP8ITC6UlelCHr5ln8jjSmCQMMEk="

ota:
  - platform: esphome
    password: "d125ba4bc02c669bcc9fe1f4ee45876f"



wifi:
  fast_connect: True  
  power_save_mode: none
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "mac5060 Hotspot"
    password: "kipkipkip" 
 

 #######gasmeter 
globals:
  - id: total_pulses
    type: int
    restore_value: false
    initial_value: '0'

 
 



  # Example configuration entry  https://github.com/willbob8/willsurridgetech/blob/master/clampSensor.yaml



  # Example source sensor The ESP32 DEV Board has two ADC (Analog to Digital Converter) registers but due 
  #the Wifi communication, only one is available for this project. 
  #Therefore, sensors can only be connected to the following GPIOs: 32, 33, 34, 35, 36, 37, 38 and 39.
