esphome:
  name: esphome-web-297cf8
  friendly_name: LiligoPoe
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: arduino
    

# Enable logging     https://www.tinytronics.nl/image/cache/data/product-3343/LilyGO-TTGO-H438-T-Internet-PoE-LAN8720A-ESP32-Pinout-1500x1500w.jpg
#gpio 36 34 16 33 4 2 14 15 12 32 25 39


logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

#wifi:  #b4:8a:0a:29:7c:f8 is anders dan de ethernet mac
#   ssid: !secret wifi_ssid
#  password: !secret wifi_password


ethernet:  #https://esphome.io/components/ethernet.html
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0  
#  # mac b4:8a:0a:29:7c:fb is anders dande wifi  192.168.1.18 fixed ip in router

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "Fixed IP via router"

 

button:
  - platform: restart
    name: "Device Restart"

web_server:
  port: 80


sensor:
  - platform: internal_temperature
    name: "Internal Temperature"    


output:
  - platform: ledc
    pin: GPIO4
    frequency: 1220  Hz
    id: pwm_output_1
    min_power : 0
    max_power: 1

  - platform: ledc
    pin: GPIO12
    frequency: 1220  Hz
    id: pwm_output_2
    min_power : 0
    max_power: 1

  - platform: ledc
    pin: GPIO16
    frequency: 1220  Hz
    id: pwm_output_3
    min_power : 0.3
    max_power: 1   
    zero_means_zero : True 

  - platform: ledc
    pin: GPIO32
    frequency: 1220  Hz
    id: pwm_output_4
    min_power : 0
    max_power: 1    

light:
  - platform: monochromatic
    output: pwm_output_1
    restore_mode: RESTORE_DEFAULT_ON
    name: "Light 1"
  - platform: monochromatic
    output: pwm_output_2
    restore_mode: RESTORE_DEFAULT_ON
    name: "Light 2"
  - platform: monochromatic
    output: pwm_output_3
    restore_mode: RESTORE_DEFAULT_ON
    name: "Light 3"
  - platform: monochromatic
    output: pwm_output_4
    restore_mode: RESTORE_DEFAULT_ON
    name: "Light 4" 


binary_sensor:
  - platform: gpio
    name: "GPIO33 Input"
    pin:
      number: 33
      mode: input
    id: gpio33_input

  - platform: gpio
    name: "GPIO34 Input"
    pin:
      number: 34
      mode: input
    id: gpio34_input

  - platform: gpio
    name: "GPIO36 Input"
    pin:
      number: 36
      mode: input
    id: gpio36_input

  - platform: gpio
    name: "GPIO39 Input"
    pin:
      number: 39
      mode: input
    id: gpio39_input



    