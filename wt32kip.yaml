# LEDs
# Er zijn de volgende LEDs:  
# - Groene LED (onboard TX-LED3 in het schema), op GPIO5 – deze LED kan door de ESP32 worden geschakeld (actief LOW).  
# - Groene LED (onboard RX-LED4 in het schema), op GPIO17 – deze LED kan door de ESP32 worden geschakeld (actief LOW).  
# - Rode LED, Power-LED, altijd aan wanneer het module wordt gevoed.  

# Niet bruikbare GPIO’s
# - IO0: Alleen gebruiken om te programmeren, deelt clocksignaal met de LAN-chip. Er is echter een pull-up aanwezig voor normaal opstarten.  
# - IO2: Kan worden gebruikt, maar beter open laten om het module te kunnen programmeren. 
#   IO2: At boot, must float or be pulled low to program. You can use this pin (especially for output) but make sure nothing pulls it high while booting. 
# - IO6 – IO11: Alleen intern voor het flash-geheugen.  
# - IO12: Beter niet gebruiken, het module start niet op als deze hoog wordt getrokken.  
# - IO13, IO18, IO19, IO21, IO22, IO23, IO25, IO26, IO27: in gebruik voor de LAN-chip.  
# - IO16: in gebruik voor de klokgenerator van de LAN-chip.  

# Bruikbare GPIO’s
# - IO1: TxD0, standaard UART voor programmeren en debuggen.  
# - IO3: RxD0, standaard UART voor programmeren en debuggen.  
# - IO4: vrij te gebruiken.  
# - IO5: vrij te gebruiken, groene LED is hierop aangesloten, gemarkeerd met RXD (7e pin van linksboven), geeft PWM uit bij het opstarten.  
# - IO14: vrij te gebruiken, maar geeft PWM uit bij het opstarten.  
# - IO15: bruikbaar, maar geeft PWM uit bij het opstarten.  
# - IO17: bruikbaar, groene LED is hierop aangesloten, gemarkeerd met TXD (8e pin van linksboven).  
# - IO35: alleen bruikbaar als ingang.  
# - IO32: vrij te gebruiken, gemarkeerd met CFG (5e pin van linksboven).  
# - IO33: vrij te gebruiken, gemarkeerd met 485_EN (6e pin van linksboven).  
# - IO36: alleen bruikbaar als ingang.  
# - IO39: alleen bruikbaar als ingang.  



# GPIO Pin Usage on WT32KIP (ESP32Dev with MCP23017)
#
# Used GPIOs:
# GPIO0    - Ethernet clk_mode input
# GPIO5    - DFPlayer RX (UART)
# GPIO12   - I2S BCLK (audio bit clock)
# GPIO14   - I2S DOUT (audio data out), also DFPlayer TX pin
# GPIO15   - I2S LRCLK (audio left-right clock)
# GPIO17   - DFPlayer TX (UART)
# GPIO32   - I2C SDA
# GPIO33   - I2C SCL
# GPIO35   - GPIO input (reserve, but assigned as input)
# GPIO36   - Cover limit switch closed (input)
# GPIO39   - Cover limit switch opened (input)

# MCP23017 expander pins used:
# A0 (pin 0) - voeding9v (9V power supply switch)
# A1 (pin 1) - rel2 (unused/reserved)
# A2 (pin 2) - rolop (cover open relay)
# A3 (pin 3) - rolneer (cover close relay)
# B7 (pin 15)- input (GPIO input from MCP23017)

# Reserve GPIOs on WT32KIP:
# GPIO1 (TX0)   - Serial debug output (avoid for other use)
# GPIO3 (RX0)   - Serial debug programming (avoid for other use)
# GPIO2          - Default LED or can be used for output reserve does not program when HIGH (rtttl buzzer werkt niet als je reboot)
# GPIO4          - Available GPIO rtttl buzzer
 
 
# Notes:
# - UART pins are used for DFPlayer communication (GPIO17 & GPIO5)
# - I2C pins (GPIO32 and GPIO33) connect to bus_a MCP23017 expander
# - Ethernet pins are dedicated and cannot be reassigned
# - Audio I2S pins are dedicated to the external DAC speaker
# - Pins marked "reserve" can be repurposed carefully if not conflicting
