dfplayer:
  uart_id: uartmp3player

  on_finished_playback:
    then:
      - if:
          condition:
            lambda: 'return !id(voeding9v_was_on);'
          then:
            - switch.turn_off: voeding9v

uart:
  - id: uartmp3player
    tx_pin: GPIO17     # pin 5 on your header
    rx_pin: GPIO5      # pin 4 on your header
    baud_rate: 9600

# Example configuration entry  sd(data of dout of din) 32     ws 15 (Clk of lrck )      sck 14 (Blck )       master niet
i2s_audio:
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO12

 

media_player:
  - platform: i2s_audio
    name: Voice Assistant Speaker
    dac_type: external
    i2s_dout_pin: GPIO14
    mode: stereo
    id: i2s_player
    on_state:
      # --- START NIEUWE LOGICA ---
      - if:
          condition:
            media_player.is_paused: i2s_player
          then:
            # Start de 5-minuten timer om te stoppen
            - script.execute: stop_na_pauze
            # Update het display (jouw bestaande code)
            - lambda: |-
                id(my_display).fill(COLOR_OFF);
                id(my_display).printf(0, 12, id(font1), "Gepauzeerd");
                id(my_display).update();
          else:
            # Als de speler niet gepauzeerd is (bv. speelt of gestopt), annuleer de timer.
            - script.stop: stop_na_pauze
            - lambda: |-
                id(my_display).fill(COLOR_OFF);
                id(my_display).printf(0, 12, id(font1), "playing...");
                id(my_display).update();
      # --- EINDE NIEUWE LOGICA ---

      # Jouw bestaande logica om de 9V voeding aan te zetten tijdens het spelen
      - if:
          condition:
            media_player.is_playing: i2s_player
          then:
            - switch.turn_on: voeding9v

    on_idle:
      - delay: 105s
      - if:
          condition:
            media_player.is_idle: i2s_player
          then:
            - switch.turn_off: voeding9v            

