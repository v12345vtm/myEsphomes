sensor:
  - platform: rotary_encoder
    name: "volumeknop36/39"
    id: rotary36_39
    pin_a: GPIO39
    pin_b: GPIO36
    internal: True
    resolution: 4
    min_value: 0
    max_value: 100   
    filters:
      - throttle: 100ms   # only update every 200ms  
    on_value:
      then:
        - media_player.volume_set:
            id: i2s_player
            volume: !lambda 'return (float)x / 100.0;'
        - dfplayer.set_volume: 
            volume: !lambda 'return (int)(x * 30 / 100);'   

#sensor:
  - platform: homeassistant
    id: ha_volume
    entity_id: media_player.wt32kip_voice_assistant_speaker_2
    internal: True
    on_value:
      then:
        - lambda: |-
            float ha_vol = id(ha_volume).state;
            if ((int)(ha_vol * 100) != id(rotary36_39).state) {
              id(rotary36_39).publish_state((int)(ha_vol * 100));
            }    

# Example configuration entry
mcp23017:
  - id: 'mcp23017_hub'
    address: 0x20

# Individual outputs
switch:
  - platform: gpio
    name: "MCP23017 9V voedng Luikje + Amp A0"
    id : voeding9v
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin A0
      number: 0
      mode:
        output: true
      inverted: True

# Individual outputs
#switch:
  - platform: gpio
    name: "MCP23017 rel2 A1"
    id : rel2
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin A1
      number: 1
      mode:
        output: true
      inverted: True

# Individual outputs
#switch:
  - platform: gpio
    name: "MCP23017 rolop A2"
    id : rolop
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin A1
      number: 2
      mode:
        output: true
      inverted: True

# Individual outputs
#switch:
  - platform: gpio
    name: "MCP23017 rolneer A3"
    id : rolneer
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin A2
      number: 3
      mode:
        output: true
      inverted: True      

# Individual inputs
binary_sensor:
  - platform: gpio
    name: "MCP23017 inp deurcontact B7"
    id : inputdeur
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin B7
      number: 15
      # One of INPUT or INPUT_PULLUP
      mode:
        input: true
        pullup: true
      inverted: false
      #interrupt: CHANGE     # Makes MCP23017 trigger INT pin on any change

#binary_sensor:
  - platform: gpio
    name: "MCP23017cover_limit_closed B6"
    id : cover_limit_closed
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin B6
      number: 14
      # One of INPUT or INPUT_PULLUP
      mode:
        input: true
        pullup: true
      inverted: True
      #interrupt: CHANGE     # Makes MCP23017 trigger INT pin on any change

#binary_sensor:
  - platform: gpio
    name: "MCP23017cover_limit_opened B5"
    id : cover_limit_opened
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin B5
      number: 13
      # One of INPUT or INPUT_PULLUP
      mode:
        input: true
        pullup: true
      inverted: True
      #interrupt: CHANGE     # Makes MCP23017 trigger INT pin on any change
  
#binary_sensor:
  - platform: gpio
    name: "MCP23017mediapauze B4"
    id : mediapauze #(drukknop in de volumeknop)
    internal: True
    pin:
      mcp23xxx: mcp23017_hub
      # Use pin B5
      number: 12
      # One of INPUT or INPUT_PULLUP
      mode:
        input: true
        pullup: true
      inverted: True
      #interrupt: CHANGE     # Makes MCP23017 trigger INT pin on any change
    on_click:
      # korte druk: tot 2999ms -> pauzeer/hersteld (toggle)
      - min_length: 0ms
        max_length: 1000ms
        then:
          - media_player.toggle: i2s_player

      # lange druk: >=3000ms -> simuleer drukken van een andere knop
      - min_length: 3000ms
        max_length: 5000ms
        then:
          - lambda: |-
              id(my_display).fill(COLOR_OFF);   // wis scherm
              id(my_display).print(0, 12, id(font1), "lang gedrukt");
              id(my_display).update();    
          - delay : 1s
          - button.press: radio2drukknop          

#binary_sensor:
  - platform: gpio
    pin:
      number: 35
      mode:
        input: true
      inverted: false
    name: "Input GPIO35"

globals:
  - id: voeding9v_was_on
    type: bool
    restore_value: no
    initial_value: "false"

cover:
  - platform: endstop
    name: "Endstop Cover"
    max_duration: 15s     
    open_action:
      - lambda: |-
          if (id(voeding9v).state) {
            id(voeding9v_was_on) = true;
          } else {
            id(voeding9v_was_on) = false;
            id(voeding9v).turn_on();
          }
      - switch.turn_on: rolop
    open_duration: 10s
    open_endstop: cover_limit_opened
    close_action:
      - lambda: |-
          if (id(voeding9v).state) {
            id(voeding9v_was_on) = true;
          } else {
            id(voeding9v_was_on) = false;
            id(voeding9v).turn_on();
          }
      - switch.turn_on: rolneer
    close_duration: 10s
    close_endstop: cover_limit_closed
    stop_action:
      - switch.turn_off: rolop
      - switch.turn_off: rolneer
      - lambda: |-
          if (!id(voeding9v_was_on)) {
            id(voeding9v).turn_off();
          }

output:
  - platform: ledc
    pin: GPIO4
    id: buzzer_output

rtttl:
  output: buzzer_output

 