esphome:
  name: velbusryno-cb3s
  friendly_name: velbusryno_cb3s

 
 
substitutions:
  relaisA : "A"  # ${relaisA} verst van knop
  relaisB : "B"  # ${relaisB}
  relaisC : "C"  # ${relaisC}
  relaisD : "D"  # ${relaisD}
  integratedbutton : "Buttonknop22"  # ${integratedbutton}
  integratedled : "ButtonLed21"  # ${integratedled} (knippert als hij offline is)

  gpiorelaisA : "GPIO24"  # ${gpiorelaisA} 
  gpiorelaisB : "GPIO6"  # ${gpiorelaisB}
  gpiorelaisC : "GPIO26"  # ${gpiorelaisC}
  gpiorelaisD : "GPIO14"  # ${gpiorelaisD}
  gpiobutton : "GPIO22"  # ${gpiobutton}
  gpioled : "GPIO21"  # ${gpioled}

  iconA : "mdi:numeric-1" # ${iconA}
  iconB : "mdi:numeric-2" # ${iconB}
  iconC : "mdi:numeric-3" # ${iconC}
  iconD : "mdi:numeric-4" # ${iconD}

bk72xx:
  board: cb3s   # https://docs.libretiny.eu/boards/cb3s/cb3s.svg

# Enable logging
logger:
  

# Enable Home Assistant API  apikey: "1A79q+SCGygjqY1PP8ITC6UlelCHr5ln8jjSmCQMMEk=" 
#otapassword: "d125ba4bc02c669bcc9fe1f4ee45876f"

api:
  encryption:
    key: !secret apikey   # "nNa/X5VLy3KM6mFWwSEDUDmt8XXsDgByS2cskI5zA2M="

ota:
  - platform: esphome
    password: !secret otapassword  # "c9fa0d85b81a608ceaec3466931e97fb"

wifi:
  on_connect:
    then:
      - light.turn_on: integratedled
      - delay: 2500ms
      - light.turn_off: integratedled
       
  ssid: !secret wifi_ssid
  password: !secret wifi_password


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "velbusryno-cb3s"
    password: "kipkipkip"

captive_portal:

  
web_server:
  js_include: "esphomecss/www.js"
  js_url: ""
  version: 2



switch:
  - platform: gpio 
    pin:
      number: ${gpiorelaisA} 
      #mode: INPUT_PULLUP
    id : relaisA #dit is onze fysyke relais
    name: ${relaisA}
    inverted: False
    icon: ${iconA}
    restore_mode: RESTORE_DEFAULT_OFF
    

  - platform: gpio
    pin: ${gpiorelaisB} 
    id : relaisB #dit is onze fysyke relais
    name: ${relaisB}
    inverted: False
    icon: ${iconB}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: ${gpiorelaisC}
    id : relaisC #dit is onze fysyke relais
    name: ${relaisC}
    inverted: False
    icon: ${iconC}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: ${gpiorelaisD}
    id : relaisD #dit is onze fysyke relais
    name: ${relaisD}
    inverted: False
    #restore_mode: ALWAYS_ON
    internal: False
    icon: ${iconD}
    restore_mode: RESTORE_DEFAULT_OFF

 


button:
  - platform: restart
    name: "Device Restart"
    entity_category: diagnostic
    icon: mdi:restart

#button:
  - platform: template
    name: "2 Minute Timer for ${relaisA}"
    id: two_minute_timer_relaisA
    icon: "mdi:water-pump"
    on_press:
      then:
        - switch.turn_on: relaisA
        - delay:   !lambda 'return id(timer_duration_relaisA).state * 1000;'
        - switch.turn_off: relaisA

  - platform: template
    name: "reset ${relaisD}"
    id: resetrelaisD
    icon: "mdi:lock-reset"
    on_press:
      then:
        - switch.turn_off: relaisD
        - delay:  5s
        - switch.turn_on: relaisD

number:
  - platform: template
    name: "Timer Duration for ${relaisA}"
    id: timer_duration_relaisA
    min_value: 10
    max_value: 300  # Maximum 5minuten (300 seconds)
    step: 5
    unit_of_measurement: "seconds"
    icon: "mdi:timer"
    optimistic: true
    restore_value: true
    initial_value: 120  # Initial value of 2 minutes (120 seconds)


binary_sensor:
  - platform: gpio
    pin:
      number: ${gpiobutton}
      inverted: true
      mode: INPUT_PULLUP
    name: ${integratedbutton}
    id : integratedbutton # This is our physical button built into the power strip
    on_click:
      min_length: 10ms
      max_length: 500ms
      then:
        - switch.toggle: relaisA
        #- button.press: two_minute_timer_relaisA
 


 



 


output:
  - platform: gpio
    pin: ${gpioled} #heeft de groene led in de button
    id: led_output
    inverted: False  
    


  


light:
  - platform: binary
    name: ${integratedled}
    output: led_output
    id : integratedled


# Create an interval to check WiFi status and control the light
interval:
  - interval: 300ms
    then:
      if:
        condition:
          not:
            wifi.connected:
        then:
          - light.toggle: integratedled


  - interval: 60s
    then:
      - logger.log:
          format: "Current time: %02d:%02d:%02d"
          args: [id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second]
          level: INFO

# Time component using NTP
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pool.ntp.org
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    timezone: "Europe/Brussels"
# Log when time is synchronized 
    on_time_sync:
      then:
        - logger.log: "Time synchronized with NTP server"
    on_time:
      - seconds: 50
        minutes: 59
        hours: 21
        then:
          #- switch.turn_off: relaisA
          - logger.log: "auto Time off ${relaisA}"
      - seconds: 00
        minutes: 00
        hours: 22
        then:
          #- switch.turn_off: relaisB
          - logger.log: "auto Time off ${relaisB}"
      - seconds: 10
        minutes: 00
        hours: 22
        then:
          #- switch.turn_off: relaisC
          - logger.log: "auto Time off ${relaisC}"

      - seconds: 10
        minutes: 00
        hours: 22
        then:
          #- switch.turn_off: relaisD
          - logger.log: "auto Time off ${relaisD}"
          
                   
          


sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength dBm"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    internal: True

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Strength Percentage"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""


 #sensor:
  - platform: internal_temperature
    name: "Internal Temperature"    

text_sensor:
  - platform: wifi_info    
    ip_address:
      name: "ip"
      id: ip
    mac_address:
      name: "mac"