esphome:
  name: mini
  friendly_name: Mini
 
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "KGLmQ6JLgONOqFZJVVC2Rc6euKyHK32rX/bk7Z2VEO8="

ota:
  platform: esphome
  password: "4a2cd29cf96d59c1f4fd233eb3c0ae4f"

web_server:
  port : 80  
                 
wifi:     
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5db
  fast_connect: True
  

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "EsphomeMiniHotspot"
    password: "kipkipkip"

captive_portal:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
    mac_address:
      name: " mac"    

switch:
  - platform: restart
    name: " restart"     

 
 
output:
  - platform: gpio
    pin: 8 #heeft de blauwe led in de button
    id: led_output
    inverted: True  

  - platform: gpio
    pin: 3 #heeft de blauwe led in de button
    id: pcbledrood
    inverted: False      
    
light:
  - platform: binary
    name: blauw
    output: led_output
    id : blauw

  - platform: binary
    name: integratedled
    output: pcbledrood
    id : integratedled    

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "wiFi Signal dB"
    id: wifi_signal_db
    update_interval: 80s
    entity_category: "diagnostic"
    disabled_by_default: true
    internal: true
    
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi_Pct"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"    


button:
  - platform: template
    id : httpdoen
    name : httpdoen
    on_press:
      then:
        - http_request.get: "http://192.168.1.2/postEvent.html?action=input&STM=0&MOD=7&CHA=0&EVT=2" 

#button:
  - platform: template
    name: "2 Minute Timer for ${relaisA}"
    id: two_minute_timer_relaisA
    icon: "mdi:water-pump"
    on_press:
      then:
        - light.turn_on: integratedled
        - delay:   !lambda 'return id(timer_duration_relaisA).state * 1000;'
        - light.turn_off: integratedled


http_request:
  useragent: esphome/device
  timeout: 4s  
  verify_ssl: false   
 

number:
  - platform: template
    name: "Timer Duration for  "
    id: timer_duration_relaisA
    min_value: 0
    max_value: 100  # Maximum 5minuten (300 seconds)
    step: 5
    unit_of_measurement: "pct"
    icon: "mdi:timer"
    optimistic: true
    restore_value: true
    initial_value: 40  # Initial value of 2 minutes (120 seconds)
 
    on_value_range:
      - above: 80
        below: 100
        then:
          - light.turn_on: integratedled
      - above: 0
        below: 80
        then:
          - light.turn_off: integratedled
 