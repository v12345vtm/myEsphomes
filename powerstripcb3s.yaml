esphome:
  name: powerstripcb3s
  friendly_name: PowerstripCB3S

bk72xx:
  board: cb3s


substitutions:
  relaisA : "Laptop"  # ${relaisA} verst van knop
  relaisB : "B"  # ${relaisB}
  relaisC : "C"  # ${relaisC}
  relaisD : "D"  # ${relaisD}
  integratedbutton : "Buttonknop"  # ${integratedbutton}
  integratedled : "ButtonLed"  # ${integratedled} (knippert als hij offline is)

  gpiorelaisA : "GPIO8"  # ${gpiorelaisA} 
  gpiorelaisB : "GPIO7"  # ${gpiorelaisB}
  gpiorelaisC : "GPIO6"  # ${gpiorelaisC}
  gpiorelaisD : "GPIO14"  # ${gpiorelaisD}



# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "2DHDcrobz3PrM/hgxa+bY0K660lxXGYkBuTEWgppZSw="

ota:
  - platform: esphome
    password: "14bee45019adb2a567e68dca2b699406"

 
# Turn off the light when WiFi connects
wifi:
  fast_connect: True  
  on_connect:
    then:
      - light.turn_on: integratedled
      - delay: 2500ms
      - light.turn_off: integratedled
       
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#  manual_ip:
#    static_ip: 192.168.1.214
#    gateway: 192.168.1.1
#    subnet: 255.255.255.0  

  #192.168.1.214

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Powerstripcb3S"
    password: "kipkipkip"

captive_portal:

web_server:
  js_include: "esphomecss/www.js"
  js_url: ""
  version: 2   



# https://docs.libretiny.eu/boards/cb3s/cb3s.svg


switch:
  - platform: gpio
    pin: ${gpiorelaisA} 
    id : relaisA #dit is onze fysyke relais
    name: ${relaisA}
    inverted: False
    icon: "mdi:laptop"
    restore_mode: RESTORE_DEFAULT_ON

  - platform: gpio
    pin: ${gpiorelaisB} 
    id : relaisB #dit is onze fysyke relais
    name: ${relaisB}
    inverted: False
    icon: "mdi:chevron-down-circle"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: ${gpiorelaisC}
    id : relaisC #dit is onze fysyke relais
    name: ${relaisC}
    inverted: False
    icon: "mdi:chevron-down-circle"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: ${gpiorelaisD}
    id : relaisD #dit is onze fysyke relais
    name: ${relaisD}
    inverted: False
    #restore_mode: ALWAYS_ON
    internal: False
    icon: "mdi:chevron-down-circle"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO24
    id: relayzoom #dit is onze fysyke led bijgesoldert
    name: "geelledintern"
    inverted: False
    internal: True
  


button:
  - platform: restart
    name: "Device Restart"
    entity_category: diagnostic
    icon: mdi:restart

#button:
  - platform: template
    name: "2 Minute Timer for ${relaisA}"
    id: two_minute_timer_relaisA
    icon: "mdi:water-pump"
    on_press:
      then:
        - switch.turn_on: relaisA
        - delay:   !lambda 'return id(timer_duration_relaisA).state * 1000;'
        - switch.turn_off: relaisA

  - platform: template
    name: "reset ${relaisD}"
    id: resetrelaisD
    icon: "mdi:lock-reset"
    on_press:
      then:
        - switch.turn_off: relaisD
        - delay:  5s
        - switch.turn_on: relaisD

number:
  - platform: template
    name: "Timer Duration for ${relaisA}"
    id: timer_duration_relaisA
    min_value: 10
    max_value: 300  # Maximum 5minuten (300 seconds)
    step: 5
    unit_of_measurement: "seconds"
    icon: "mdi:timer"
    optimistic: true
    restore_value: true
    initial_value: 120  # Initial value of 2 minutes (120 seconds)


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO10
      inverted: true
      mode: INPUT_PULLUP
    name: ${integratedbutton}
    id: integratedbutton
    on_click:
      - min_length: 10ms
        max_length: 500ms
        then:
          - switch.toggle: relaisA
          - lambda: |-
              id(button_click_count) += 1;
      - min_length: 3s
        max_length: 4s
        then:
          - logger.log: "Long press detected, rebooting ESP..."
          - lambda: |-
              ESP.restart();

 



#binary_sensor:
  - platform: gpio
    pin:
      number: GPIO26
      inverted: True
      mode: INPUT_PULLUP
    name: knop26
    id : knop26 #dit is onze fysike knop gesoldeert    intern niet nr buitengebracht
    internal: True



 


output:
  - platform: gpio
    pin: GPIO23 #heeft de groene led in de button
    id: led_output
    inverted: True  


  


light:
  - platform: binary
    name: ${integratedled}
    output: led_output
    id : integratedled


# Create an interval to check WiFi status and control the light
interval:
  - interval: 300ms
    then:
      if:
        condition:
          not:
            wifi.connected:
        then:
          - light.toggle: integratedled


  - interval: 60s
    then:
      - logger.log:
          format: "Current time: %02d:%02d:%02d"
          args: [id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second]
          level: INFO


 
  - interval: 60s
    then:
      - lambda: |-
          id(button_click_count) = 0;
      - logger.log: "Counter reset via interval!"




# Time component using NTP
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pool.ntp.org
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    timezone: "Europe/Brussels"
# Log when time is synchronized 
    on_time_sync:
      then:
        - logger.log: "Time synchronized with NTP server"
        
    on_time:
      - seconds: 50
        minutes: 59
        hours: 21
        then:
          #- switch.turn_off: relaisA
          - logger.log: "auto Time off ${relaisA}"
      - seconds: 00
        minutes: 00
        hours: 22
        then:
          #- switch.turn_off: relaisB
          - logger.log: "auto Time off ${relaisB}"
      - seconds: 10
        minutes: 00
        hours: 22
        then:
          #- switch.turn_off: relaisC
          - logger.log: "auto Time off ${relaisC}"

      - seconds: 10
        minutes: 00
        hours: 22
        then:
          #- switch.turn_off: relaisD
          - logger.log: "auto Time off ${relaisD}"
          
                   
          

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength dBm"
    id: wifi_signal_db
    update_interval: 160s
    entity_category: "diagnostic"
    internal: true

  
 #sensor:
  - platform: internal_temperature
    name: "Internal Temperature"    
    update_interval: 120s

#sensor:
  - platform: template
    name: "Button Click Count"
    id: button_click_count_sensor
    lambda: |-
      return id(button_click_count);
    update_interval: 10s
    internal: True


globals:
  - id: button_click_count
    type: int
    restore_value: yes
    initial_value: '0'
