# Example configuration entry for ESP32
i2c:
  sda: 21
  scl: 22
  scan: true
  id: bus_a

 #SSD1331  128x64
display:
  - platform: ssd1306_i2c
    i2c_id: bus_a
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
        it.line(0, 64, 128, 0 );      
        it.print(0, 0, id(font1), "Pomponnetje");
        it.print(0, 16, id(font1), "Pomponnetje");
        it.print(0, 32, id(font1), "Pomponnetje");
        it.print(0, 48, id(font1), "Pomponnetje");        
 


font:
  - file: 'slkscr.ttf'
    id: font1
    size: 15
  - file: 'BebasNeue-Regular.ttf'
    id: font2
    size: 14
  - file: 'arial.ttf'
    id: font3
    size: 14



 
spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

 
##ieuwe lora confif sinds die officieel is
sx127x:
  cs_pin: GPIO18
  rst_pin: GPIO23
  frequency: 868950000
  modulation: OOK
  rx_start: true
  bandwidth: 50_0kHz
  rx_floor: -90  
  bitsync : False
  packet_mode: false



remote_transmitter:
  pin:
    number: GPIO32
    mode:
      input: true
      output: true
      pullup: true
      open_drain: true
    
  eot_level: false
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - sx127x.set_mode_standby
      - remote_transmitter.digital_write: false
      - sx127x.set_mode_tx
  on_complete:
    then:
      - sx127x.set_mode_standby
      - remote_transmitter.digital_write: true
      - sx127x.set_mode_rx
 

