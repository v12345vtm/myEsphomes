switch:
 

  - platform: gpio
    pin: ${gpiorelaisA} 
    id: relaisA #dit is onze fysyke relais
    name: ${relaisA}
    inverted: False
    icon: "mdi:power-socket-eu"
    restore_mode : RESTORE_DEFAULT_OFF 

rtttl:
  output: buzzer_output 
  gain: 60%





output:
  - platform: gpio
    pin: ${gpiointegratedled}  #heeft de blaue led in de button wifi status
    id: led_outputbl
    inverted: False  

  - platform: gpio
    pin: ${gpiorelaistatusled}  #heeft de roode led in de button relay status
    id: led_outputrd
    inverted: False  

#output:
  - platform: libretiny_pwm
    id: buzzer_output
    pin:  ${gpioibuzzer}     

light:
  - platform: binary
    name: ${integratedled}
    output: led_outputbl
    id : integratedled
    icon : "mdi:led-off"

  - platform: binary
    name: ${relaistatusled}
    output: led_outputrd
    id : relaistatusled 
    icon : "mdi:led-off"

  

 

binary_sensor:
  - platform: gpio
    pin:
      number: ${gpiointegratedbutton}
      inverted: true
      mode: INPUT_PULLUP
    name: ${integratedbutton}
    id : integratedbutton # This is our physical button built into the power strip
    on_click:
      min_length: 10ms
      max_length: 500ms
      then:
        - button.press: omschakelen_relaisA
 
#binary_sensor:
  - platform: homeassistant
    id: binary_sensorttgo443_lscdeurbel
    entity_id: binary_sensor.ttgo443_lscdeurbel
    internal: true
    on_press: 
      then:
        - button.press: buzzerCarolBells

  






# Create an interval to check WiFi status and control the light
interval:
  - interval: 300ms
    then:
      if:
        condition:
          not:
            wifi.connected:
        then:
          - light.toggle: integratedled

  - interval: 60s
    then:
      - logger.log:
          format: "Current time: %02d:%02d:%02d"
          args: [id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second]
          level: INFO
# Time component using NTP
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pool.ntp.org
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    timezone: "Europe/Brussels"

# Log when time is synchronized

    on_time_sync:
     then:
      - logger.log: "Time synchronized with NTP server"

    on_time:
      - seconds: 50
        minutes: 59
        hours: 21
        then:
          - switch.turn_off: relaisA
          - logger.log: "auto Time off ${relaisA}"
      

 


sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s
    entity_category: "diagnostic"















        