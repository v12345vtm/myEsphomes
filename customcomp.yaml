esphome:
  name: customcomp
  friendly_name: customcomp


# This section runs once when the device boots up.
# It gives the "Input Data" sensor its initial value of "hello".
# This will automatically trigger the on_value automation above.
  on_boot:
    priority: -10.0 # Run after components are set up.
    then:
      - text_sensor.template.publish:
          id: input_data
          state: "hello"    

external_components:
  - source: 
      type: local
      path: components 

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:

web_server:
  port: 80  

# Enable Home Assistant API
api:
  encryption:
    key: "IAs0dLcwsY/6cJfCftxmrBIi1MPzLl8nBndE89xLo1Y="

ota:
  - platform: esphome
    password: "2b787efb3c3f9403695e1618f9901b45"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: empty_sensor
    name: Empty sensor
 

# Define your text sensor entities
text_sensor:
  # 1. This is the OUTPUT sensor. It uses your custom component
  #    and will hold the final value (e.g., "hello1DE1").
  - platform: empty_text_sensor
    name: "Data with CRC"
    id: data_with_crc

  # 2. This is the INPUT sensor. It's a standard template sensor
  #    that you can use to set the data for the calculation.
  - platform: template
    name: "Input Data"
    id: input_data
    # This automation triggers whenever the state of "Input Data" changes.
    # The variable 'x' holds the new state of the sensor.
    on_value:
      then:
        # Call the C++ function directly on our custom component instance.
        # Pass the value of this sensor ('x') to the function.
        - lambda: |-
            id(data_with_crc).calculate_and_publish(x);

