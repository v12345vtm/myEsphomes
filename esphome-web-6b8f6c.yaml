esphome:
  name: esphome-web-6b8f6c
  friendly_name: Mini_Universal_IR
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

 
#################################################


 

web_server:
  #js_include: "esphomecss/www.js"
  #js_url: ""
  #version: 2
  local: True


  version: 3
  sorting_groups:
    - id: LG_TV
      name: "TV LG"
      sorting_weight: 1
    - id: PIONEER_AMP
      name: "Pioneer Amp"  
      sorting_weight: 20
    - id: HDMI_switch_
      name: "3Port Hdmi selector"  
      sorting_weight: 30    
    - id: panasonic_tv
      name: "Panasonic_tv"  
      sorting_weight: 30          
 
wifi:
  fast_connect: True  
  power_save_mode: none
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  
  ap:
    ssid: "UniversalIRminisender"
 

captive_portal:
# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
 


text_sensor:
  - platform: wifi_info
    ip_address:
      name: ip
 
 

switch:
#Restart esp
  - platform: restart
    name: restart"

remote_receiver:
  pin :
    number : GPIO3 # 
    inverted : True
  dump: all


remote_transmitter:   
  pin:
    number: GPIO4
    inverted: False  # 
  carrier_duty_percent: 50%
     
