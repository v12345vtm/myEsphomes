  encryption:
    key: "Lf5cKAXiQLd6GTUoBSYvBlbmqvHbnVVbf3tt+bmifG8="

ota:
  platform: esphome
  password: "f5ad39fbc755fc28b22427da3049449a"

wifi:
  networks:
  - ssid: !secret wifi_ssiddp
    password: !secret wifi_passworddp
  - ssid: !secret wifi_ssiddpl
