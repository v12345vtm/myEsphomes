  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp01Radar Fallback Hotspot"
    password: "kipkipkip"

captive_portal:
    

web_server:
  port : 80


text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${device_name}_IP" 
    mac_address:
      name: "${device_name}_mac"

#text_sensor:
  - platform: template
    name: "Status"
    id: status_sensor
    lambda: |-
      return {"online"};



text:
  - platform: template
    name: "text"
    optimistic: true
    min_length: 0
    max_length: 20
    mode: text
    initial_value  : "online"

#  Led
output:
  - platform: gpio
    pin: GPIO2
    id: uitgangvdesp
    inverted: yes
    

 

##  Led  
light:
  - platform: binary
    output: uitgangvdesp
    name: esp-out-GPIO2



 

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength dBm"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    internal: True

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Strength Percentage"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""



  - platform: dallas_temp
    address: 0x39bf7ba608646128 #zie log tijdens het opstarten wat je adres is vb 0x3ac7f0a308646128
    name: "Radar1Temperature"  
    id: radar2temp
    filters :
    - calibrate_linear:
      - 0.0 -> 0.0
      - 24.6 ->17        



button:
#Restart esp
  - platform: restart
    name: "${device_name}_restart"   


 
one_wire:
  - platform: gpio
    pin: GPIO0
 