#Configuration variables: Output (required, ID): ID of the output component to be used for this servo
servo:
  - id: servo_control
    output: pwm_output
    auto_detach_time: 0s
    #transition_length: 5s
    
     

web_server:
  port : 80

# Example configuration entry
esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution : 1280x1024 
  name: myESP32-CAM16

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot   

output:
# flashlight
  - platform: gpio
    pin: GPIO4
    id: gpio_4
# statuslight
  - platform: gpio
    pin:
      number: GPIO33
      inverted: True
    id: gpio_33    


#Output Platform
#output:
  - platform: ledc
    id: pwm_output
    pin: 0
    frequency: 50 Hz    

light:
#flashlight
  - platform: binary
    output: gpio_4
    name: ${device_name} Flash
    id: flash
#statuslight
  - platform: binary   
    output: gpio_33
    name: ${device_name} Status

    
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${device_name}_IP"
    #ssid:
      #name: "${device_name}_ssid"
    #bssid:
      #name: "${device_name}_bssid"
    mac_address:
      name: "${device_name}_mac"
    #scan_results:
      #name: "${device_name}_scanresults"
    #dns_address:
      #name: "${device_name}_dns"    
switch:      
  - platform: restart
    name: ${device_name}_restart  
 

 
    
binary_sensor:
  - platform: status
    name: ${device_name}status    

# Example configuration entry with 2 sensors and filter
sensor:
#sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${device_name}_WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 80s
    entity_category: "diagnostic"
    disabled_by_default: true
    internal: true
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${device_name}_WiFi_Pct"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
  - platform: uptime
    name: "${device_name}_Uptime"   
  - platform: internal_temperature
    name: "${device_name}_Intern_Temperature"      

# Example configuration entry
#sensor:
  - platform: internal_temperature
    name: "${device_name}Internal Temperature"  
    disabled_by_default: true   


 


 



    