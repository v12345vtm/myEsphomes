bk72xx:
  board: generic-bk7231n-qfn32-tuya

# Enable logging
logger:


substitutions:
  name: lsc-light-rgb-01
  friendly_name: lsc-light-rgb-01

# https://devices.esphome.io/devices/LSC-Light-White-and-Color-Ambiance-2578539

# Enable Home Assistant API
api:
  encryption:
    key: "HF8YfqzdYXs4J7z65XH6vfXiU5Bc/982ec7umE8ARtQ="

ota:
  - platform: esphome
    password: "865c48c87acf8009da087ffa87aa2c36"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Lscrgbcct Fallback Hotspot"
    password: "kipkipkip"

captive_portal:

web_server:
  port: 80  


sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

  - platform: uptime
    name: Uptime Sensor
    id: uptime_sensor
    update_interval: 60s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h " : "") +
                (minutes ? to_string(minutes) + "m " : "") +
                (to_string(seconds) + "s")
              ).c_str();

text_sensor:
  - platform: template
    name: Uptime Human Readable
    id: uptime_human
    icon: mdi:clock-start
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status
    entity_category: diagnostic

button:
  - platform: restart
    id: restart_button
    name: Restart
    entity_category: diagnostic

bp5758d:
  data_pin: 26
  clock_pin: 24

output:
  - platform: bp5758d
    id: output_red
    channel: 2
  - platform: bp5758d
    id: output_green
    channel: 1
  - platform: bp5758d
    id: output_blue
    channel: 3
  - platform: bp5758d
    id: output_cold_white
    channel: 5
  - platform: bp5758d
    id: output_warm_white
    channel: 4

light:
  - platform: rgbww
    name: ${friendly_name}
    id: the_light
    restore_mode: ALWAYS_OFF
    red: output_red
    green: output_green
    blue: output_blue
    cold_white: output_cold_white
    warm_white: output_warm_white
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    color_interlock: true
    constant_brightness: true
    effects:
      - random:
          name: "Slow Random"
          transition_length: 30s
          update_interval: 30s
      - random:
          name: "Fast Random"
          transition_length: 4s
          update_interval: 5s
      - strobe:
      - flicker:
          alpha: 50% #The percentage that the last color value should affect the light. More or less the “forget-factor” of an exponential moving average. Defaults to 95%.
          intensity: 50% #The intensity of the flickering, basically the maximum amplitude of the random offsets. Defaults to 1.5%.
      - lambda:
          name: Throb
          update_interval: 1s
          lambda: |-
            static int state = 0;
            auto call = id(the_light).turn_on();
            // Transtion of 1000ms = 1s
            call.set_transition_length(1000);
            if (state == 0) {
              call.set_brightness(1.0);
            } else {
              call.set_brightness(0.01);
            }
            call.perform();
            state += 1;
            if (state == 2)
              state = 0;



