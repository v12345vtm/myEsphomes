# https://docs.libretiny.eu/boards/wb2s/wb2s.svg

substitutions:
  relaisA : "relais"  # ${relaisA} verst van knop 
  integratedbutton : "Button"  # ${integratedbutton}
  integratedled : "Wifi (blue)"  # ${integratedled} (blauw knippert als hij offline is)
 #nvt relaistatusled : "Led (red)"  # ${relaistatusled} (rood knippert als hij offline is)

  gpiorelaisA : "GPIO24"  # ${gpiorelaisA} 
  gpiointegratedled : "GPIO7"  # ${gpiointegratedled}
 # nvt  gpiorelaistatusled: "GPIO6"  # ${gpiorelaistatusled}
  gpiointegratedbutton: "GPIO26"  # ${gpiointegratedbutton}
 

 
 


button:
  - platform: restart
    name: "Device Restart"
    entity_category: diagnostic
    icon: mdi:restart

#button:
  - platform: template
    name: "toggle ${relaisA}"
    id: omschakelen_relaisA
    icon: "mdi:toggle-switch"
    on_press:
      then:
        - switch.toggle: relaisA



switch:
 

  - platform: gpio
    pin: ${gpiorelaisA} 
    id: relaisA #dit is onze fysyke relais
    name: ${relaisA}
    inverted: False
    icon: "mdi:power-socket-eu"



output:
  - platform: gpio
    pin: ${gpiointegratedled}  #heeft de blaue led in de button wifi status
    id: led_outputbl
    inverted: True  

 # - platform: gpio
 #   pin: ${gpiorelaistatusled}  #heeft de roode led in de button relay status
 #   id: led_outputrd
 #   inverted: False  

light:
  - platform: binary
    name: ${integratedled}
    output: led_outputbl
    id : integratedled
    icon : "mdi:led-off"
    

#  - platform: binary
#    name: ${relaistatusled}
#    output: led_outputrd
#    id : relaistatusled 
#    icon : "mdi:led-off"

  

 

binary_sensor:
  - platform: gpio
    pin:
      number: ${gpiointegratedbutton}
      inverted: true
      mode: INPUT_PULLUP
    name: ${integratedbutton}
    id : integratedbutton # This is our physical button built into the power strip
    on_click:
      min_length: 10ms
      max_length: 500ms
      then:
        - button.press: omschakelen_relaisA
 








# Create an interval to check WiFi status and control the light
interval:
  - interval: 300ms
    then:
      if:
        condition:
          not:
            wifi.connected:
        then:
          - light.toggle: integratedled


  - interval: 60s
    then:
      - logger.log:
          format: "Current time: %02d:%02d:%02d"
          args: [id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second]
          level: INFO
# Time component using NTP
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pool.ntp.org
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    timezone: "Europe/Brussels"


# Log when time is synchronized
 
    on_time_sync:
      then:
        - logger.log: "Time synchronized with NTP server"


sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength dBm"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    internal: True

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Strength Percentage"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""


