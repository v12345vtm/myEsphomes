web_server:
  js_include: "esphomecss/www.js"
  js_url: ""
  version: 2

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${device_name}_IP"
      id : ip
      internal: True
      
 

 

  - platform: template
    name: "fixed ip"
    lambda: 'return id(ip).state + " 1.8 via router";'



# Example configuration entry

one_wire:
  - platform: gpio
    pin: ${pin_dallas}
   

 
 
    
# Example configuration entry https://raw.githubusercontent.com/willbob8/willsurridgetech/master/clampSensor.yaml  op pin:A0
# Example configuration entry puls via hallsensor GPIO05 (=D01)

sensor:
 

#sensor:
  - platform: dallas_temp
    address: 0x2bf5e5a308646128 #zie log voor zijn adres
    name: "esp8266 room Temperature"    
    filters :
      - calibrate_linear:
        - 0.0 -> 0.0
        - 27.3 ->21.7
#sensor:
 
 
 

 

# blauwe builtin Led
output:
  - platform: gpio
    pin: ${pin_ingebouwdeblauweled} #GPIO2
    id: gpio_2
    inverted: yes
    

  - platform: gpio
    pin: ${pin_ingebouwderodeled} #GPIO16
    id: onboardled_red
    inverted: yes
 


## blauwe builtin Led op gpio_2
light:
  - platform: binary
    output: gpio_2
    name: esp-builinledBLEU


  - platform: binary
    output: onboardled_red
    name: esp-builinledRED

 

#garagepoort relais op pin: GPIO4
switch:
  - platform: gpio
    pin:  ${pin_relais} #GPIO4
    id: relay
    name: "garagepoort"
    icon: "mdi:gate"
    inverted: no
    on_turn_on:
    - delay: 500ms
    - switch.turn_off: relay






