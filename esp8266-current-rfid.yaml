esphome:
  name: "esp8266-current-rfid"
  friendly_name: ESP8266-current-rfid

esp8266:
  board: esp01_1m

substitutions:
  device_name: esp8266
  pin_dallas : GPIO10  
  pin_hallesensor : GPIO05 
  pin_ingebouwdeblauweled : GPIO2 
  pin_ingebouwderodeled : GPIO16
  pin_relais : GPIO4 


# Enable logging
