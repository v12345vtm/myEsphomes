web_server:
  port: 80

button:
  - platform: restart
    name: "Reboot Device"
    entity_category: "diagnostic"
    icon: "mdi:restart"

time:
  - platform: sntp
    id: my_time

text:
  - platform: template
    name: "Omschrijving CT1"
    id: omschr_CT1
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "Ct1"
