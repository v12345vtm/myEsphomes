i2s_audio:
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO4

media_player:
  - platform: i2s_audio
    name: Voice Assistant Speaker
    dac_type: external
    i2s_dout_pin: GPIO14
    mode: stereo  
    id: i2s_player
    on_state:
      - if:
          condition:
            media_player.is_playing:
          then:
            - delay: 100ms
            - switch.turn_off: mute
      - if:
          condition:
            or:
              - media_player.is_idle
              - media_player.is_paused
          then:
            - switch.turn_on: mute  
    

output:
  - platform: gpio
    pin: GPIO5  ##2is de blauwe led
    id: amp_mute_output
    inverted: true
    

  - platform: gpio
    pin: GPIO2  ##2is de blauwe led
    id: amp_mute_led
    inverted: False

switch:
  - platform: output
    name: "Amp Mute"
    output: amp_mute_output
    id: mute
    icon: mdi:volume-mute
    on_turn_on:
      - script.execute: blink_mute_led
   #   - logger.log_level: DEBUG
        
    on_turn_off:
      - script.stop: blink_mute_led
      - output.turn_off: amp_mute_led
    #  - logger.log_level: NONE
 
        

script:
  - id: blink_mute_led
    then:
      - while:
          condition:
            switch.is_on: mute
          then:
            - output.turn_on: amp_mute_led
            - delay: 500ms
            - output.turn_off: amp_mute_led
            - delay: 500ms