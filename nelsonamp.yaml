remote_receiver:
  pin :
    number : GPIO18 #GPIO18 #12niet op pcb vrij
    inverted : True
  #dump: lg  
 
#     0x20DFF10E
#data=0x20DF0DF2, nbits=32
# 0x20DF5DA2
# 0x20DF718E

binary_sensor:
  - platform: remote_receiver
    name: "lg_prev"
    filters:
      - delayed_off: 10ms
    lg: 
      data: 0x20DFF10E
      nbits: 32
    on_press:
      then:
       # - logger.log: "lgprev"
       #- media_player.play_next  #pakt niet
        


  - platform: remote_receiver
    name: "lgplay"
    filters:
      - delayed_off: 10ms
    lg: 
      data: 0x20DF0DF2
      nbits: 32
    on_press:
      then:
       # - logger.log: "lgplay"
        - media_player.play


  - platform: remote_receiver
    name: "lgpauze"
    filters:
      - delayed_off: 10ms
    lg: 
      data: 0x20DF5DA2
      nbits: 32
    on_press:
      then:
      #  - logger.log: "lgpauze"
        - media_player.pause


  - platform: remote_receiver
    name: "lgnext"
    filters:
      - delayed_off: 10ms
    lg: 
      data: 0x20DF718E
      nbits: 32
    on_press:
      then:
      #  - logger.log: "lgnext"
      #   - media_player.play_next:            target: media_player.i2s_player
       


  - platform: remote_receiver
    name: "lgvolup"
    filters:
      - delayed_off: 10ms
    lg: 
      data: 0x20DF40BF
      nbits: 32
    on_press:
      then:
      #  - logger.log: "lgvolup"
        - media_player.volume_up          

  - platform: remote_receiver
    name: "lgvolmin"
    filters:
      - delayed_off: 10ms
    lg: 
      data: 0x20DFC03F
      nbits: 32
    on_press:
      then:
        #- logger.log: "lgvolmin"       
        - media_player.volume_down




