esphome:
  name: velbusryld
  friendly_name: velbusRyld
  on_boot: 
    then:
      - switch.turn_on: relais2 
      

esp8266:
  board: nodemcuv2 

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "V9KSMW9OpQCFc2fSWKodZgX6PBCyIreyY3q4PRM2n1A="

ota:
  - platform: esphome
    password: "9c588b0d9fc3d466a0e1cd5170bb9fef"

interval:

  - interval: 60s
    then:
      - logger.log:
          format: "Current time: %02d:%02d:%02d"
          args: [id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second]
          level: INFO


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.7
    gateway: 192.168.1.1  # Set your gateway IP here (usually the router IP)
    subnet: 255.255.255.0  # Set the subnet mask (common is 255.255.255.0)
    dns1: 192.168.1.1  #verplicht  voor de timeserver
  on_connect:
    then:      
      - delay: 2500ms
      - logger.log : "in de router is dit fixed ip omdat peha actionurl doet 192.168.1.7"

 

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Velbusryld esp8622 nodemcu"
    password: "kipkipkip"

captive_portal:

web_server:
  js_include: "esphomecss/www.js"
  js_url: ""
  version: 2


http_request:
  useragent: esphome/device
  timeout: 4s  
  verify_ssl: false

switch:
  - platform: gpio
    pin: 4
    id: relais1 #dit is onze fysyke relais 
    name: "1)homeassistant"    #naam niet aanpassen zit in pehaapp
    inverted: False
    icon: "mdi:numeric-1"
    restore_mode: ALWAYS_ON


  - platform: gpio
    pin: 5
    id: relais4 #dit is onze fysyke relais
    name: "4)tvvvlaanderen-Chromec-irhdmi"   #naam niet aanpassen zit in pehaapp
    inverted: False
    icon: "mdi:numeric-4"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - logger.log: "decoder in standby zetten , en na 15sec de decoder spanningsloos doen"   
      - http_request.get:  "http://192.168.1.9/api/remotecontrol?command=116"     #tvvdecoder uitzetten
      - delay: 15s
      - switch.turn_off: relais4

  - platform: gpio
    pin: 14
    id: relais2 #dit is onze fysyke relais
    name: "2)versterker"  #naam niet aanpassen zit in pehaapp
    inverted: False
    icon: "mdi:numeric-2"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - logger.log: "5port switch "    
      - delay: 5s
      - switch.turn_on: relais2 




  - platform: gpio
    pin: 12
    id: relais3 #dit is onze fysyke relais
    name: "3)res"
    inverted: False
    icon: "mdi:numeric-3"
    restore_mode: RESTORE_DEFAULT_OFF



text_sensor:
  - platform: wifi_info    
    ip_address:
      name: "ip"
      id: ip
      update_interval: 1500s
      internal: True
 

  - platform: template
    name: "fixed IP"
    lambda: 'return id(ip).state + " fixedIP esphome";'


sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength dBm"
    id: wifi_signal_db
    update_interval: 160s
    entity_category: "diagnostic"
    internal: True
 

button:
  - platform: restart
    name: "Restart"    


time:
  - platform: sntp
    id: sntp_time
    servers:
      - pool.ntp.org
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    timezone: "Europe/Brussels"
# Log when time is synchronized 
    on_time_sync:
      then:
        - logger.log: "Time synchronized with NTP server"
    on_time:
      - seconds: 50
        minutes: 59
        hours: 23
        then:
          - switch.turn_off: relais4
          - logger.log: "auto Time off ${relais4}"        

 



