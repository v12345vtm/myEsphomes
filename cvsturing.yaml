mcp23017:
  - id: 'mcp23017_hub'
    address: 0x20

# COUNTER voor actieve relays (GPA1-GPB7)
globals:
  - id: active_relays
    type: int
    restore_value: no
    initial_value: '0'

# ALL 16 OUTPUTS - EXACT MCP23017 PIN NAMEN
switch:
  # GPA0 MASTER (automatisch)
#  - platform: template
#    name: "🚀 MCP GPA0 MASTER AUTO"  # Pin 0 → Wire to GPA0 (Master power)
#    id: gpa0_master
#    optimistic: true
#    icon: "mdi:power"
#    turn_on_action:
#      - switch.turn_on: gpa0
#    turn_off_action:
#      - switch.turn_off: gpa0

  # GPA0 fysieke output
  - platform: gpio
    name: "MCP GPA0🚀"     # Pin 1  → Wire to GPA1
    id: gpa0_master
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      mcp23xxx: mcp23017_hub
      number: 0
      mode: output
      inverted: true
    icon: "mdi:power"
    

  # PORT A (1-7) - Individueel + AUTO master trigger
  - platform: gpio
    name: "MCP GPA1"     # Pin 1  → Wire to GPA1
    id: gpa1
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      mcp23xxx: mcp23017_hub
      number: 1
      mode: output
      inverted: true
    on_turn_on:
      - script.execute: update_master

    on_turn_off:
      - script.execute: update_master


