#########################################################################################
# CVSTURING - CV Switchboard Controller WITH MASTER GPA0 AUTO-LOGIC
#
# OVERZICHT:
# - ESP32 + MCP23017 (16 digitale uitgangen: GPA0-GPB7)
# - GPA0 = MASTER, automatisch AAN als minstens één uitgang actief is
# - GPA1-GPB7 = individuele uitgangen, timers: 30 / 45 / 60 min
# - Restore_mode: bij reboot worden uitgangen hersteld (veilig)
#
# LOGICA:
# 1) Timer knop → script start → uitgang AAN
# 2) Uitgang AAN → update_master script → GPA0_MASTER AAN
# 3) Timer verloopt → uitgang UIT → update_master script
# 4) Als geen uitgangen actief → MASTER UIT
#
# TIMERGEDRAG:
# - 30 / 45 / 60 minuten
# - Mode: restart → herstart timer als opnieuw ingedrukt
#
# VEILIGHEID:
# - Uitgangen standaard UIT bij eerste boot
# - Automatische mastercontrole
# - Herstartknop beschikbaar
#
# NETWERK:
# - WiFi + fallback hotspot
# - Webinterface: poort 80
# - Home Assistant API met encryptie
#
# EXTRA:
# - Alle uitgangen kunnen handmatig via Web/HA worden bediend
# - Master logica blijft actief bij manuele bediening
#########################################################################################

