switch:
  - platform: gpio
    pin: 22
    name: "Luikje_Openen"
    id: Luik_Openen
    disabled_by_default: true
    internal: true
  - platform: gpio
    pin: 23
    name: "Luikje_sluiten"
    id: Luik_sluiten
    disabled_by_default: true
    internal: true
 
     

     
  - platform: restart
    name: ${device_name}_restart  



 
 


# Example configuration entry
binary_sensor:
  - platform: gpio
    pin: 
      number: 13
      inverted: false
    name: "opened_cover_switch"
    device_class: window
    id: opened_cover_switch

  - platform: status
    name: ${device_name}status  

 
 
  - platform: gpio
    pin: 
      number: 27
      inverted: false
    name: "closed_cover_switch"
    device_class: window
    id: closed_cover_switch
    on_press: 
      then:
         - lambda: |-
            id(button_click_count) += 1;
         - logger.log: "pluseen"


