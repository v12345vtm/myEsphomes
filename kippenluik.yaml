# not working lamdas..  value_template : "{{states('cover.endstop_cover') }}"
#"{{ state_attr('chickencoop', 'cover.kippenluik_endstop_cover') }}"
#value_template: "{{states('cover.endstop_cover') }}"    
cover:
  - platform: endstop
    name: "Endstop Cover"
    id : chickencoop
    max_duration: 15s      
    
    open_action:
      - switch.turn_on: Luik_Openen
    open_duration: 60s
    open_endstop: opened_cover_switch

    close_action:
      - switch.turn_on: Luik_sluiten
    close_duration: 59s    
    close_endstop: closed_cover_switch

    stop_action:
      - switch.turn_off: Luik_Openen
      - switch.turn_off: Luik_sluiten

   


# Example configuration entr    pin: 36 is ldr 
 


i2s_audio:
  i2s_lrclk_pin: GPIO19
  i2s_bclk_pin: GPIO18

media_player:
  - platform: i2s_audio
    name: Kippenluik Speaker
    dac_type: external
    i2s_dout_pin: GPIO5
    mode: mono
    on_pause: 
      then:
        - media_player.stop

 



 
 

 
output:
  - platform: ledc
    pin: GPIO26
    id: buzzer_output

 

rtttl:
  output: buzzer_output
  
 
 
button:
  - platform: template
    name: buzzerCarolBells
    id: buzzerCarolBells
    icon: "mdi:emoticon-outline"
    on_press:
      - rtttl.play:  'CarolBells:d=8,o=5,b=180:4a,g#,a,4f#,4a,g#,a,4f#,4f#6,f#6,f#6,e6,d6,4c#6,c#6,c#6,b,a,4b,b,b,c#6,b,4f#,f#,f#,4f#,c#,d#,e,f#,g#,a,b,c#6,4b,4a,c#,d#,e,f#,g#,a,b,c#6,4b,4a,4a,g#,a,4f#,4a,g#,a,4f#'


 
  - platform: template
    name: buzzerlocked
    id: buzzerlocked
    icon: "mdi:emoticon-outline"
    on_press:
      - rtttl.play: 'locked:d=4,o=5,b=140:32d6,32p,32d6'
        
  - platform: template
    name: buzzeropen
    id: buzzeropen
    icon: "mdi:emoticon-outline"
    on_press:
      - rtttl.play: 's:d=4,o=5,b=125:32b4 '
 
   
